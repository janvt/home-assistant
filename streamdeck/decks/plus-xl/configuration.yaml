      # icon glyph, no label) — see spec.py. `text: ""` overrides the app's
      # own default overlay text for `go-to-page` ("Go to\nPage\nHome"),
      # which would otherwise be drawn on top of the icon regardless of what
      # `icon:` points at.
      - special_type: go-to-page
        special_type_data: Home
        icon: /Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/home.png
        text: ""

    dials:
      # Dial 1 only — the deck's OWN screen brightness, not a room. `state`
      # (not `state_attribute`) because an input_number's value IS its main
      # state, unlike volume_level/brightness which are attributes on a
      # media_player/light. Negative step matches the physical-turn direction
      # convention used by every other dial on the Home page (see there).
      #
      # Dials 2-6 are intentionally undefined: `update_all_dials` blanks
      # unconfigured touchscreen segments automatically on page switch, and
      # turning one just logs "has no valid dial_key" — harmless on a page
      # nobody lingers on.
      - entity_id: input_number.streamdeck_xl_brightness
        dial_event_type: TURN
        allow_touchscreen_events: true
        service: input_number.set_value
        service_data:
          value: '{{ dial_value() | int }}'
        delay: 0.3
        icon: '/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/deck_bright_{{ ((((dial_value() / 5) | round) * 5) | int) }}.png'
        attributes:
          min: 0
          max: 100
          step: -2
