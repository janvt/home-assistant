# home-assistant-streamdeck-yaml — Stream Deck Plus XL (runs natively on the Mac)
#
# 36 keys (9x4) + 6 dials, on a single page — no mode/paging key needed.
#
# LAYOUT — deliberately sparse; only 15 of 36 keys are used. Buttons fill
# left→right, top→bottom, so every gap needs an explicit `special_type: empty`
# placeholder to keep the later keys in their columns.
#
#   col: 1        2        3         4        5        6        7  8  9
#   r1   Work S   Work     Chill     Vinyl    Pain C   ·        ·  ·  Lights Off
#   r2   Hallway  Kitchen  LivingRm  Outside  Bathrm   Record   ·  ·  House
#   r3   ·        ·        ·         ·        ·        ·        ·  ·  Apartment
#   r4   ·        ·        ·         ·        ·        ·        ·  ·  Fan
#
# ICON PATHS ARE ABSOLUTE AND MACHINE-SPECIFIC. The app resolves a relative
# `icon:` against its own installed package assets dir (NOT the cwd), so these
# must be absolute. They point at this checkout on the Mac; if you move the
# repo or run it elsewhere, update the prefix:
#   /Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons
# (The Pi's Plus config gets away with /app/icons/... because that's absolute
# inside its container.)
#
# Images come from ../../generate_icons.py --deck plus-xl (see spec.py).

brightness: 80
auto_reload: true
inactivity_time: -1

pages:
  - name: Home

    buttons:
      # ══ Row 1 ════════════════════════════════════════════════════════════
      # Scenes, cols 1-5. Each calls script.streamdeck_scene_toggle: if
      # input_select.active_scene already equals this scene it turns the area
      # OFF (and clears the helper), otherwise it activates the scene.
      # `entity_id` is the helper so the key re-renders when the active scene
      # changes; the icon template highlights whichever scene is active.
      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.work_s
          area: kitchen
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/work_s_on.png" if is_state("input_select.active_scene", "work_s") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/work_s_off.png" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.work
          area: living_room
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/work_on.png" if is_state("input_select.active_scene", "work") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/work_off.png" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.chill
          area: living_room
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/chill_on.png" if is_state("input_select.active_scene", "chill") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/chill_off.png" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.vinyl
          area: living_room
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/vinyl_on.png" if is_state("input_select.active_scene", "vinyl") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/vinyl_off.png" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.pain_cave
          area: living_room
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/pain_cave_on.png" if is_state("input_select.active_scene", "pain_cave") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/pain_cave_off.png" }}'

      # cols 6-8 — empty
      - special_type: empty
      - special_type: empty
      - special_type: empty

      # col 9 — all lights off
      - entity_id: script.turn_off_all_lights
        service: script.turn_on
        icon: /Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/lights_off.png

      # ══ Row 2 ════════════════════════════════════════════════════════════
      # Lights, cols 1-6.
      - entity_id: light.shellypro1pm_ec62608ad35c_switch_0
        service: light.toggle
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/hallway_on.png" if is_state("light.shellypro1pm_ec62608ad35c_switch_0", "on") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/hallway_off.png" }}'

      - entity_id: light.kitchen_ceiling_light
        service: light.toggle
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/kitchen_on.png" if is_state("light.kitchen_ceiling_light", "on") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/kitchen_off.png" }}'

      - entity_id: light.living_room_ceiling_light
        service: light.toggle
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/lr_ceiling_on.png" if is_state("light.living_room_ceiling_light", "on") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/lr_ceiling_off.png" }}'

      - entity_id: light.balcony_ceiling_light
        service: light.toggle
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/outside_on.png" if is_state("light.balcony_ceiling_light", "on") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/outside_off.png" }}'

      - entity_id: light.shellyplus2pm_10061ccb8718_switch_0
        service: light.toggle
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/bathroom_on.png" if is_state("light.shellyplus2pm_10061ccb8718_switch_0", "on") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/bathroom_off.png" }}'

      - entity_id: light.record_player
        service: light.toggle
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/record_on.png" if is_state("light.record_player", "on") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/record_off.png" }}'

      # cols 7-8 — empty
      - special_type: empty
      - special_type: empty

      # col 9 — unlock the house / street door (SwitchBot buzzer, one-shot
      # toggle). `delay: 5` is the accidental-press guard: a press starts a
      # 5s countdown ring and pressing again during it cancels.
      - entity_id: switch.buzzer
        service: switch.toggle
        icon: /Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/unlock_house.png
        delay: 5

      # ══ Row 3 ════════════════════════════════════════════════════════════
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty

      # col 9 — unlock the apartment door (Nuki, unlatches). Same 5s guard.
      - entity_id: lock.nuki_schmatzknauf_lock_2
        service: lock.open
        icon: /Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/unlock_apartment.png
        delay: 5

      # ══ Row 4 ════════════════════════════════════════════════════════════
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty
      - special_type: empty

      # col 9 — poop button: press triggers the "Keep bathroom fan on"
      # automation, but the icon reflects the input_boolean it manages.
      # `linked_entity` makes the key re-render when that helper changes while
      # `entity_id` keeps automation.trigger aimed at the automation.
      - entity_id: automation.keep_bathroom_fan_on
        linked_entity: input_boolean.keep_bathroom_fan_on
        service: automation.trigger
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/fan_on.png" if is_state("input_boolean.keep_bathroom_fan_on", "on") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/fan_off.png" }}'

    dials:
      # Six dials, ALL TURN-only — no PUSH entries. That's deliberate: the app's
      # eager local re-render looks a dial up by raw list index while being
      # handed the *sorted* index, so it only works when they line up, i.e. when
      # no dial has a paired PUSH. Keeping every dial TURN-only means all six
      # track your finger live (mixing paired and unpaired dials would redraw
      # the wrong segment). Turn direction is reversed (negative step) and the
      # shade bar is display-inverted (full bar = closed), matching the Plus.
      # ── Dial 1: Living Room volume ────────────────────────────────────────
      - entity_id: media_player.living_room
        dial_event_type: TURN
        state_attribute: volume_level
        allow_touchscreen_events: true
        service: media_player.volume_set
        service_data:
          volume_level: '{{ dial_value() | float }}'
        delay: 0.6
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/lr_volume_muted.png" if state_attr("media_player.living_room", "is_volume_muted") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/lr_volume_" ~ (((((dial_value() * 100) / 2) | round) * 2) | int) ~ ".png" }}'
        attributes:
          min: 0
          max: 1
          step: -0.02
      # ── Dial 2: Madagascar volume ────────────────────────────────────────
      - entity_id: media_player.unnamed_room
        dial_event_type: TURN
        state_attribute: volume_level
        allow_touchscreen_events: true
        service: media_player.volume_set
        service_data:
          volume_level: '{{ dial_value() | float }}'
        delay: 0.6
        icon: '{{ "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/madagascar_volume_muted.png" if state_attr("media_player.unnamed_room", "is_volume_muted") else "/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/madagascar_volume_" ~ (((((dial_value() * 100) / 2) | round) * 2) | int) ~ ".png" }}'
        attributes:
          min: 0
          max: 1
          step: -0.02
      # ── Dial 3: Living Room ceiling brightness ────────────────────────────
      - entity_id: light.living_room_ceiling_light
        dial_event_type: TURN
        state_attribute: brightness
        allow_touchscreen_events: true
        service: light.turn_on
        service_data:
          brightness: '{{ dial_value() | int }}'
        delay: 0.3
        icon: '/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/lr_bright_{{ ((((dial_value() / 255 * 100) / 5) | round) * 5) | int }}.png'
        attributes:
          min: 0
          max: 255
          step: -13
      # ── Dial 4: Kitchen ceiling brightness ────────────────────────────────
      - entity_id: light.kitchen_ceiling_light
        dial_event_type: TURN
        state_attribute: brightness
        allow_touchscreen_events: true
        service: light.turn_on
        service_data:
          brightness: '{{ dial_value() | int }}'
        delay: 0.3
        icon: '/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/kitchen_bright_{{ ((((dial_value() / 255 * 100) / 5) | round) * 5) | int }}.png'
        attributes:
          min: 0
          max: 255
          step: -13
      # ── Dials 5-6: shades ─────────────────────────────────────────────────
      - entity_id: cover.living_room_shades
        dial_event_type: TURN
        state_attribute: current_position
        allow_touchscreen_events: true
        service: cover.set_cover_position
        service_data:
          position: '{{ dial_value() | int }}'
        delay: 0.5
        icon: '/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/lr_shade_{{ ((((100 - dial_value()) / 5) | round) * 5) | int }}.png'
        attributes:
          min: 0
          max: 100
          step: -5

      - entity_id: cover.shellyplus2pm_cc7b5c894ba4
        dial_event_type: TURN
        state_attribute: current_position
        allow_touchscreen_events: true
        service: cover.set_cover_position
        service_data:
          position: '{{ dial_value() | int }}'
        delay: 0.5
        icon: '/Users/janvt/dev/jan/home-assistant/streamdeck/decks/plus-xl/icons/dials/kitchen_shade_{{ ((((100 - dial_value()) / 5) | round) * 5) | int }}.png'
        attributes:
          min: 0
          max: 100
          step: -5
