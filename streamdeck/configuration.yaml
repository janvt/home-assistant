# home-assistant-streamdeck-yaml configuration
#
# Docs / schema: https://github.com/basnijholt/home-assistant-streamdeck-yaml
#
# ── Dial layout (Stream Deck Plus, left → right) ─────────────────────────────
#   Dial 1  Living Room media volume     turn = volume,     push = mute toggle
#   Dial 2  Madagascar media volume      turn = volume,     push = mute toggle
#   Dial 3  Living Room ceiling light    turn = brightness, push = toggle LR area
#   Dial 4  Kitchen ceiling light        turn = brightness, push = toggle Kitchen area
#
# How physical dials are assigned: the app walks the `dials` list and merges two
# *consecutive* entries into one physical dial when their `dial_event_type`
# differs (e.g. a TURN entry immediately followed by a PUSH entry). A TURN entry
# followed by another TURN entry stays on its own dial. So the six entries below
# collapse to exactly four dials — do not reorder them.
#
# `dial_value()` reads the entity's `state_attribute` in its NATIVE units, so
# min/max/step are set in those same units (volume_level 0–1, brightness 0–255)
# to keep the ring and service calls aligned.

brightness: 80          # Stream Deck LCD/button brightness (0-100)
auto_reload: true       # reload this file automatically when it changes
inactivity_time: -1     # auto-off after N seconds of inactivity (-1 = disabled)

pages:
  - name: Home

    # LCD keys (Stream Deck Plus has 8: two rows of four). The list fills
    # left→right, top→bottom, so entries 1-4 are the top row and 5-8 the bottom.
    buttons:
      # ── Top row: scene toggles ──────────────────────────────────────────────
      # Each calls script.streamdeck_scene_toggle. If input_select.active_scene
      # already equals this scene it turns OFF the whole area (and clears the
      # helper to 'none'); otherwise it activates the scene. `entity_id` is the
      # active-scene helper so the button re-renders when the active scene
      # changes, and icon_mdi_color highlights the currently-active scene.
      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.chill
          area: living_room
        text: ''
        icon: '{{ "/app/icons/chill_on.png" if is_state("input_select.active_scene", "chill") else "/app/icons/chill_off.png" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.vinyl
          area: living_room
        text: ''
        icon: '{{ "/app/icons/vinyl_on.png" if is_state("input_select.active_scene", "vinyl") else "/app/icons/vinyl_off.png" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.pain_cave
          area: living_room
        text: ''
        icon: '{{ "/app/icons/pain_cave_on.png" if is_state("input_select.active_scene", "pain_cave") else "/app/icons/pain_cave_off.png" }}'

      # "Work S" — HA also has scene.work ("Work"); swap if you meant that one.
      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.work_s
          area: kitchen
        text: ''
        icon: '{{ "/app/icons/work_s_on.png" if is_state("input_select.active_scene", "work_s") else "/app/icons/work_s_off.png" }}'

      # ── Bottom row ──────────────────────────────────────────────────────────
      # Key 5: toggle the hallway lights (Shelly Pro "Hallway Spots").
      - entity_id: light.shellypro1pm_ec62608ad35c_switch_0
        service: light.toggle
        text: ''
        icon: '{{ "/app/icons/hallway_on.png" if is_state("light.shellypro1pm_ec62608ad35c_switch_0", "on") else "/app/icons/hallway_off.png" }}'

      # Key 6: toggle the outside light (Balcony Ceiling Light).
      - entity_id: light.balcony_ceiling_light
        service: light.toggle
        text: ''
        icon: '{{ "/app/icons/outside_on.png" if is_state("light.balcony_ceiling_light", "on") else "/app/icons/outside_off.png" }}'
      # Key 7: poop button — press triggers the "Keep bathroom fan on"
      # automation; the icon/background reflect input_boolean.keep_bathroom_fan_on.
      # `linked_entity` makes the button re-render when that helper changes,
      # while `entity_id` keeps automation.trigger aimed at the automation.
      - entity_id: automation.keep_bathroom_fan_on
        linked_entity: input_boolean.keep_bathroom_fan_on
        service: automation.trigger
        text: ''
        icon: '{{ "/app/icons/fan_on.png" if is_state("input_boolean.keep_bathroom_fan_on", "on") else "/app/icons/fan_off.png" }}'

      # Key 8: mode button — cycles to the next view (next-page wraps around).
      - special_type: next-page
        text: ''
        icon: /app/icons/menu.png

    dials:
      # ── Dial 1: Living Room media volume ────────────────────────────────────
      # TURN: set volume (0–1 native scale, shown as %).
      - entity_id: media_player.living_room
        dial_event_type: TURN
        state_attribute: volume_level
        allow_touchscreen_events: true
        service: media_player.volume_set
        service_data:
          volume_level: '{{ dial_value() | float }}'
        text: ''
        delay: 0.6
        icon: '/app/icons/dials/lr_volume_{{ ((((dial_value() * 100) / 2) | round) * 2) | int }}.png'
        attributes:
          min: 0
          max: 1
          step: -0.02
      # PUSH: toggle mute.
      - entity_id: media_player.living_room
        dial_event_type: PUSH
        service: media_player.volume_mute
        service_data:
          is_volume_muted: '{{ not state_attr("media_player.living_room", "is_volume_muted") }}'

      # ── Dial 2: Madagascar media volume ─────────────────────────────────────
      # HA entity is `media_player.unnamed_room` (friendly name "Madagascar").
      - entity_id: media_player.unnamed_room
        dial_event_type: TURN
        state_attribute: volume_level
        allow_touchscreen_events: true
        service: media_player.volume_set
        service_data:
          volume_level: '{{ dial_value() | float }}'
        text: ''
        delay: 0.6
        icon: '/app/icons/dials/madagascar_volume_{{ ((((dial_value() * 100) / 2) | round) * 2) | int }}.png'
        attributes:
          min: 0
          max: 1
          step: -0.02
      # PUSH: toggle mute.
      - entity_id: media_player.unnamed_room
        dial_event_type: PUSH
        service: media_player.volume_mute
        service_data:
          is_volume_muted: '{{ not state_attr("media_player.unnamed_room", "is_volume_muted") }}'

      # ── Dial 3: Living Room ceiling light brightness ────────────────────────
      # TURN: set brightness (0–255 native scale, shown as %).
      - entity_id: light.living_room_ceiling_light
        dial_event_type: TURN
        state_attribute: brightness
        allow_touchscreen_events: true
        service: light.turn_on
        service_data:
          brightness: '{{ dial_value() | int }}'
        text: ''
        delay: 0.3
        icon: '/app/icons/dials/lr_bright_{{ ((((dial_value() / 255 * 100) / 5) | round) * 5) | int }}.png'
        attributes:
          min: 0
          max: 255
          step: -13   # ~5% per detent
      # PUSH: toggle every light in the Living Room area.
      - entity_id: light.living_room_ceiling_light
        dial_event_type: PUSH
        service: light.toggle
        target:
          area_id: living_room

      # ── Dial 4: Kitchen ceiling light brightness ────────────────────────────
      # TURN: set brightness.
      - entity_id: light.kitchen_ceiling_light
        dial_event_type: TURN
        state_attribute: brightness
        allow_touchscreen_events: true
        service: light.turn_on
        service_data:
          brightness: '{{ dial_value() | int }}'
        text: ''
        delay: 0.3
        icon: '/app/icons/dials/kitchen_bright_{{ ((((dial_value() / 255 * 100) / 5) | round) * 5) | int }}.png'
        attributes:
          min: 0
          max: 255
          step: -13   # ~5% per detent
      # PUSH: toggle every light in the Kitchen area.
      - entity_id: light.kitchen_ceiling_light
        dial_event_type: PUSH
        service: light.toggle
        target:
          area_id: kitchen

  # ═══════════════════════════════════════════════════════════════════════════
  # Page 2 — Shades: dials control shade positions, buttons handle whole-home
  # actions and mode helpers. Key 8 mirrors Home's mode button to cycle back.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: Shades

    buttons:
      # ── Top row: whole-home actions ─────────────────────────────────────────
      - entity_id: script.turn_off_all_lights
        service: script.turn_on
        text: ''
        icon: /app/icons/lights_off.png

      - entity_id: script.open_all_blinds
        service: script.turn_on
        text: ''
        icon: /app/icons/open_all.png

      # No "close all" script exists, so close every shade explicitly (listed so
      # a future non-shade cover can't be caught by an `entity_id: all`).
      - service: cover.close_cover
        service_data:
          entity_id:
            - cover.living_room_shades
            - cover.shellyplus2pm_cc7b5c894ba4
            - cover.bedroom_shades
            - cover.guest_bedroom_shades
            - cover.east_facing_shades
        text: ''
        icon: /app/icons/close_all.png

      # Key 4: open the apartment door (Nuki smart lock — lock.open unlatches).
      # `delay` shows a 2s countdown ring before firing; press again to cancel.
      - entity_id: lock.nuki_schmatzknauf_lock_2
        service: lock.open
        text: ''
        icon: /app/icons/apartment.png
        delay: 5

      # ── Bottom row: mode toggles + nav ──────────────────────────────────────
      - entity_id: input_boolean.guest_mode
        service: input_boolean.toggle
        text: ''
        icon: '{{ "/app/icons/guest_on.png" if is_state("input_boolean.guest_mode", "on") else "/app/icons/guest_off.png" }}'

      - entity_id: input_boolean.cleaning_mode
        service: input_boolean.toggle
        text: ''
        icon: '{{ "/app/icons/cleaning_on.png" if is_state("input_boolean.cleaning_mode", "on") else "/app/icons/cleaning_off.png" }}'

      # Key 7: open the house / street door (SwitchBot "Buzzer"). It's a passive
      # momentary pusher, so a one-shot toggle triggers the press.
      # `delay` shows a 2s countdown ring before firing; press again to cancel.
      - entity_id: switch.buzzer
        service: switch.toggle
        text: ''
        icon: /app/icons/house.png
        delay: 5

      # Key 8: mode button — cycles back to Home (next-page wraps).
      - special_type: next-page
        text: ''
        icon: /app/icons/menu.png

    dials:
      # Each shade: TURN sets position (0–100%), PUSH stops movement.
      # ── Dial 1: Living Room shades ──────────────────────────────────────────
      - entity_id: cover.living_room_shades
        dial_event_type: TURN
        state_attribute: current_position
        allow_touchscreen_events: true
        service: cover.set_cover_position
        service_data:
          position: '{{ dial_value() | int }}'
        text: ''
        delay: 0.5
        icon: '/app/icons/dials/lr_shade_{{ ((((100 - dial_value()) / 10) | round) * 10) | int }}.png'
        attributes:
          min: 0
          max: 100
          step: -10
      - entity_id: cover.living_room_shades
        dial_event_type: PUSH
        service: cover.stop_cover

      # ── Dial 2: Kitchen shades ──────────────────────────────────────────────
      - entity_id: cover.shellyplus2pm_cc7b5c894ba4
        dial_event_type: TURN
        state_attribute: current_position
        allow_touchscreen_events: true
        service: cover.set_cover_position
        service_data:
          position: '{{ dial_value() | int }}'
        text: ''
        delay: 0.5
        icon: '/app/icons/dials/kitchen_shade_{{ ((((100 - dial_value()) / 10) | round) * 10) | int }}.png'
        attributes:
          min: 0
          max: 100
          step: -10
      - entity_id: cover.shellyplus2pm_cc7b5c894ba4
        dial_event_type: PUSH
        service: cover.stop_cover

      # ── Dial 3: Bedroom shades ──────────────────────────────────────────────
      - entity_id: cover.bedroom_shades
        dial_event_type: TURN
        state_attribute: current_position
        allow_touchscreen_events: true
        service: cover.set_cover_position
        service_data:
          position: '{{ dial_value() | int }}'
        text: ''
        delay: 0.5
        icon: '/app/icons/dials/bedroom_shade_{{ ((((100 - dial_value()) / 10) | round) * 10) | int }}.png'
        attributes:
          min: 0
          max: 100
          step: -10
      - entity_id: cover.bedroom_shades
        dial_event_type: PUSH
        service: cover.stop_cover

      # ── Dial 4: Guest Bedroom shades ────────────────────────────────────────
      - entity_id: cover.guest_bedroom_shades
        dial_event_type: TURN
        state_attribute: current_position
        allow_touchscreen_events: true
        service: cover.set_cover_position
        service_data:
          position: '{{ dial_value() | int }}'
        text: ''
        delay: 0.5
        icon: '/app/icons/dials/guest_shade_{{ ((((100 - dial_value()) / 10) | round) * 10) | int }}.png'
        attributes:
          min: 0
          max: 100
          step: -10
      - entity_id: cover.guest_bedroom_shades
        dial_event_type: PUSH
        service: cover.stop_cover
