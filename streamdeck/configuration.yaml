# home-assistant-streamdeck-yaml configuration
#
# Docs / schema: https://github.com/basnijholt/home-assistant-streamdeck-yaml
#
# ── Dial layout (Stream Deck Plus, left → right) ─────────────────────────────
#   Dial 1  Living Room media volume     turn = volume,     push = mute toggle
#   Dial 2  Madagascar media volume      turn = volume,     push = mute toggle
#   Dial 3  Living Room ceiling light    turn = brightness, push = toggle LR area
#   Dial 4  Kitchen ceiling light        turn = brightness, push = toggle Kitchen area
#
# How physical dials are assigned: the app walks the `dials` list and merges two
# *consecutive* entries into one physical dial when their `dial_event_type`
# differs (e.g. a TURN entry immediately followed by a PUSH entry). A TURN entry
# followed by another TURN entry stays on its own dial. So the six entries below
# collapse to exactly four dials — do not reorder them.
#
# `dial_value()` reads the entity's `state_attribute` in its NATIVE units, so
# min/max/step are set in those same units (volume_level 0–1, brightness 0–255)
# to keep the ring and service calls aligned.

brightness: 80          # Stream Deck LCD/button brightness (0-100)
auto_reload: true       # reload this file automatically when it changes
inactivity_time: -1     # auto-off after N seconds of inactivity (-1 = disabled)

pages:
  - name: Home

    # LCD keys (Stream Deck Plus has 8: two rows of four). The list fills
    # left→right, top→bottom, so entries 1-4 are the top row and 5-8 the bottom.
    buttons:
      # ── Top row: scene toggles ──────────────────────────────────────────────
      # Each calls script.streamdeck_scene_toggle. If input_select.active_scene
      # already equals this scene it turns OFF the whole area (and clears the
      # helper to 'none'); otherwise it activates the scene. `entity_id` is the
      # active-scene helper so the button re-renders when the active scene
      # changes, and icon_mdi_color highlights the currently-active scene.
      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.chill
          area: living_room
        text: Chill
        icon_mdi: sofa
        icon_mdi_color: '{{ "#f5a623" if is_state("input_select.active_scene", "chill") else "#555555" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.vinyl
          area: living_room
        text: Vinyl
        icon_mdi: album
        icon_mdi_color: '{{ "#f5a623" if is_state("input_select.active_scene", "vinyl") else "#555555" }}'

      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.pain_cave
          area: living_room
        text: Pain Cave
        icon_mdi: bike-fast
        icon_mdi_color: '{{ "#f5a623" if is_state("input_select.active_scene", "pain_cave") else "#555555" }}'

      # "Work S" — HA also has scene.work ("Work"); swap if you meant that one.
      - entity_id: input_select.active_scene
        service: script.streamdeck_scene_toggle
        service_data:
          scene: scene.work_s
          area: kitchen
        text: Work S
        icon_mdi: desk
        icon_mdi_color: '{{ "#f5a623" if is_state("input_select.active_scene", "work_s") else "#555555" }}'

      # ── Bottom row ──────────────────────────────────────────────────────────
      # Key 5: toggle the hallway lights (Shelly Pro "Hallway Spots").
      - entity_id: light.shellypro1pm_ec62608ad35c_switch_0
        service: light.toggle
        text: Hallway
        icon_mdi: wall-sconce

      # Key 6: toggle the outside light (Balcony Ceiling Light).
      - entity_id: light.balcony_ceiling_light
        service: light.toggle
        text: Outside
        icon_mdi: outdoor-lamp
      # Key 7: poop button — press triggers the "Keep bathroom fan on"
      # automation; the icon/background reflect input_boolean.keep_bathroom_fan_on.
      # `linked_entity` makes the button re-render when that helper changes,
      # while `entity_id` keeps automation.trigger aimed at the automation.
      - entity_id: automation.keep_bathroom_fan_on
        linked_entity: input_boolean.keep_bathroom_fan_on
        service: automation.trigger
        text: ''
        icon_mdi: emoticon-poop
        icon_mdi_color: '{{ "#d98a3d" if is_state("input_boolean.keep_bathroom_fan_on", "on") else "#6b5442" }}'
        icon_background_color: '{{ "#7b4a12" if is_state("input_boolean.keep_bathroom_fan_on", "on") else "#2e2016" }}'
      # Key 8: free.

    dials:
      # ── Dial 1: Living Room media volume ────────────────────────────────────
      # TURN: set volume (0–1 native scale, shown as %).
      - entity_id: media_player.living_room
        dial_event_type: TURN
        state_attribute: volume_level
        allow_touchscreen_events: true
        service: media_player.volume_set
        service_data:
          volume_level: '{{ dial_value() | float }}'
        text: |
          Living Room
          {{ (dial_value() * 100) | round }}%
        icon: 'ring:{{ (dial_value() * 100) | round }}'
        attributes:
          min: 0
          max: 1
          step: 0.05
      # PUSH: toggle mute.
      - entity_id: media_player.living_room
        dial_event_type: PUSH
        service: media_player.volume_mute
        service_data:
          is_volume_muted: '{{ not state_attr("media_player.living_room", "is_volume_muted") }}'

      # ── Dial 2: Madagascar media volume ─────────────────────────────────────
      # HA entity is `media_player.unnamed_room` (friendly name "Madagascar").
      - entity_id: media_player.unnamed_room
        dial_event_type: TURN
        state_attribute: volume_level
        allow_touchscreen_events: true
        service: media_player.volume_set
        service_data:
          volume_level: '{{ dial_value() | float }}'
        text: |
          Madagascar
          {{ (dial_value() * 100) | round }}%
        icon: 'ring:{{ (dial_value() * 100) | round }}'
        attributes:
          min: 0
          max: 1
          step: 0.05
      # PUSH: toggle mute.
      - entity_id: media_player.unnamed_room
        dial_event_type: PUSH
        service: media_player.volume_mute
        service_data:
          is_volume_muted: '{{ not state_attr("media_player.unnamed_room", "is_volume_muted") }}'

      # ── Dial 3: Living Room ceiling light brightness ────────────────────────
      # TURN: set brightness (0–255 native scale, shown as %).
      - entity_id: light.living_room_ceiling_light
        dial_event_type: TURN
        state_attribute: brightness
        allow_touchscreen_events: true
        service: light.turn_on
        service_data:
          brightness: '{{ dial_value() | int }}'
        text: |
          LR Ceiling
          {{ (dial_value() / 255 * 100) | round }}%
        icon: 'ring:{{ (dial_value() / 255 * 100) | round }}'
        attributes:
          min: 0
          max: 255
          step: 13   # ~5% per detent
      # PUSH: toggle every light in the Living Room area.
      - entity_id: light.living_room_ceiling_light
        dial_event_type: PUSH
        service: light.toggle
        target:
          area_id: living_room

      # ── Dial 4: Kitchen ceiling light brightness ────────────────────────────
      # TURN: set brightness.
      - entity_id: light.kitchen_ceiling_light
        dial_event_type: TURN
        state_attribute: brightness
        allow_touchscreen_events: true
        service: light.turn_on
        service_data:
          brightness: '{{ dial_value() | int }}'
        text: |
          Kitchen Ceiling
          {{ (dial_value() / 255 * 100) | round }}%
        icon: 'ring:{{ (dial_value() / 255 * 100) | round }}'
        attributes:
          min: 0
          max: 255
          step: 13   # ~5% per detent
      # PUSH: toggle every light in the Kitchen area.
      - entity_id: light.kitchen_ceiling_light
        dial_event_type: PUSH
        service: light.toggle
        target:
          area_id: kitchen
