version: '3'

# Task runner for the Stream Deck decks (https://taskfile.dev).
# Run `task` with no args to list everything.
#
# Two decks, two very different deployments:
#   plus  — Stream Deck Plus on the Raspberry Pi, in Docker Compose
#   xl    — Stream Deck Plus XL on the Mac, running NATIVELY (Docker Desktop on
#           macOS can't pass through USB), and needing the streamdeck library
#           from git master since Plus XL support is not in any release yet.
#
# Rendering is shared: generate_icons.py --deck <name> uses decks/<name>/spec.py.

vars:
  VENV: .venv
  PY: '{{.VENV}}/bin/python'
  PIP: '{{.VENV}}/bin/pip'
  XLVENV: decks/plus-xl/.venv
  XLLABEL: com.janvt.streamdeck-xl
  # The app needs Python >= 3.10, but macOS ships 3.9 as `python3` (Xcode CLT).
  # Pick the newest suitable interpreter on PATH; override with XLPY=... if you
  # want a specific one.
  XLPY:
    sh: |
      for p in python3.13 python3.12 python3.11 python3.10; do
        command -v "$p" 2>/dev/null && exit 0
      done
      command -v python3

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  # ── shared ────────────────────────────────────────────────────────────────
  venv:
    desc: Create the Python venv used by the image renderer
    status:
      - test -x {{.PY}}
      - '{{.PY}} -c "import PIL"'
    cmds:
      - python3 -m venv {{.VENV}}
      - '{{.PIP}} install --quiet --upgrade pip pillow'

  icons:
    desc: Render images for one deck (DECK=plus|plus-xl)
    deps: [venv]
    requires:
      vars: [DECK]
    cmds:
      - '{{.PY}} generate_icons.py --deck {{.DECK}}'

  icons:all:
    desc: Render images for every deck
    deps: [venv]
    cmds:
      - '{{.PY}} generate_icons.py --deck all'

  harden:
    desc: Idempotently apply host-level hardening/resilience on the Pi (needs sudo)
    cmds: [bash harden.sh]

  # ── plus (Raspberry Pi, Docker) ───────────────────────────────────────────
  plus:env:
    desc: Create decks/plus/.env from the template
    dir: decks/plus
    status: [test -f .env]
    cmds:
      - cp .env.example .env
      - "echo '>> Created decks/plus/.env — set HASS_HOST, WEBSOCKET_PROTOCOL, HASS_TOKEN'"

  plus:icons:
    desc: Render the Plus images (120px)
    cmds: [{task: icons, vars: {DECK: plus}}]

  plus:up:
    desc: Render images and start the Plus container (detached)
    deps: [plus:icons]
    dir: decks/plus
    preconditions:
      - sh: test -f .env
        msg: "No decks/plus/.env — run `task plus:env` and fill it in first."
    cmds:
      - docker compose up -d
      - docker compose ps

  plus:down:
    desc: Stop and remove the Plus container
    dir: decks/plus
    cmds: [docker compose down]

  plus:restart:
    desc: Restart the Plus container
    dir: decks/plus
    cmds: [docker compose restart]

  plus:logs:
    desc: Follow the Plus container logs
    dir: decks/plus
    cmds: [docker compose logs -f]

  plus:regen:
    desc: Rebuild the Plus images and restart to apply them
    deps: [plus:icons]
    dir: decks/plus
    cmds: [docker compose restart]

  plus:deploy:
    desc: Full Plus bring-up — build images, start, follow logs
    deps: [plus:icons]
    dir: decks/plus
    preconditions:
      - sh: test -f .env
        msg: "No decks/plus/.env — run `task plus:env` and fill it in first."
    cmds:
      - docker compose up -d
      - docker compose logs -f

  plus:update:
    desc: One-shot Plus update — git pull, rebuild images, restart
    cmds:
      - git pull
      - {task: plus:icons}
      - task: plus:restart

  # ── plus-xl (Mac, native) ─────────────────────────────────────────────────
  xl:deps:
    desc: Install the macOS system libraries the deck needs (Homebrew)
    status:
      - brew list hidapi >/dev/null 2>&1
      - brew list cairo >/dev/null 2>&1
      - brew list libffi >/dev/null 2>&1
    cmds:
      - brew install hidapi cairo libffi

  xl:install:
    desc: Create the app venv for the Plus XL (streamdeck from git master — Plus XL is not in any release)
    deps: [xl:deps]
    status:
      - test -x {{.XLVENV}}/bin/home-assistant-streamdeck-yaml
      - '{{.XLVENV}}/bin/python -c "from StreamDeck.Devices.StreamDeckPlusXL import StreamDeckPlusXL"'
    preconditions:
      # macOS ships Python 3.9 as `python3`; the app requires >= 3.10.
      - sh: '{{.XLPY}} -c "import sys; sys.exit(0 if sys.version_info >= (3,10) else 1)"'
        msg: "{{.XLPY}} is too old — the app needs Python >= 3.10. Install one (brew install python@3.12) or pass XLPY=/path/to/python3.12."
    cmds:
      - 'echo "using {{.XLPY}} ($({{.XLPY}} --version))"'
      - rm -rf {{.XLVENV}}
      - '{{.XLPY}} -m venv {{.XLVENV}}'
      - '{{.XLVENV}}/bin/pip install --quiet --upgrade pip'
      - '{{.XLVENV}}/bin/pip install --quiet "home-assistant-streamdeck-yaml @ git+https://github.com/basnijholt/home-assistant-streamdeck-yaml@main"'
      # Install AFTER the app so this master build wins over the PyPI release
      # that the app's dependency resolution pulls in (0.9.8 has no Plus XL).
      - '{{.XLVENV}}/bin/pip install --quiet --upgrade --force-reinstall "streamdeck @ git+https://github.com/abcminiuser/python-elgato-streamdeck@master"'
      - '{{.XLVENV}}/bin/python -c "from StreamDeck.Devices.StreamDeckPlusXL import StreamDeckPlusXL as D; print(f\"Plus XL support OK: {D.KEY_COUNT} keys, {D.DIAL_COUNT} dials, {D.KEY_PIXEL_WIDTH}px\")"'

  xl:font:
    desc: Repair the app's missing bundled font (upstream ships no assets/ in the wheel)
    deps: [xl:install]
    cmds:
      - |
        {{.XLVENV}}/bin/python - <<'PY'
        import pathlib, urllib.request
        import home_assistant_streamdeck_yaml as m
        assets = pathlib.Path(m.__file__).parent / "assets"
        assets.mkdir(exist_ok=True)
        font = assets / "Roboto-Regular.ttf"
        if font.exists():
            print(f"font present: {font}")
        else:
            # The pip/git install ships only the .py module — no assets/ — so
            # any button with text: set raises "OSError: cannot open resource".
            # Our labels are baked into the PNGs so we normally never hit this,
            # but restore the font so text-bearing buttons work if ever added.
            url = ("https://raw.githubusercontent.com/basnijholt/"
                   "home-assistant-streamdeck-yaml/main/assets/Roboto-Regular.ttf")
            urllib.request.urlretrieve(url, font)
            print(f"fetched missing font -> {font}")
        PY

  xl:patch:
    desc: Patch the app to honour TOUCHSCREEN_ROTATION (Plus XL strip is blank without it)
    deps: [xl:install]
    cmds:
      - '{{.XLVENV}}/bin/python decks/plus-xl/patch_touchscreen_rotation.py'

  xl:env:
    desc: Create decks/plus-xl/.env from the template
    dir: decks/plus-xl
    status: [test -f .env]
    cmds:
      - cp .env.example .env
      - "echo '>> Created decks/plus-xl/.env — set HASS_HOST/HASS_TOKEN (use ha.janvt.dev + wss from the laptop)'"

  xl:icons:
    desc: Render the Plus XL images (112px)
    cmds: [{task: icons, vars: {DECK: plus-xl}}]

  xl:detect:
    desc: List attached Stream Decks (confirms the Plus XL is seen)
    deps: [xl:install]
    cmds:
      - '{{.XLVENV}}/bin/python -c "from StreamDeck.DeviceManager import DeviceManager; ds=DeviceManager().enumerate(); print(f\"{len(ds)} deck(s):\"); [print(f\"  {d.deck_type()}  pid=0x{d.product_id():04x}\") for d in ds]"'

  xl:doctor:
    desc: Report which local Mac controls work here (TCC permission tiers)
    deps: [xl:install]
    cmds:
      - 'PYTHONPATH=. {{.XLVENV}}/bin/python -m ext.doctor'

  xl:test:
    desc: Test the local-action extension against the installed app (no hardware needed)
    deps: [xl:install]
    cmds:
      - 'PYTHONPATH=. {{.XLVENV}}/bin/python -m ext.selftest'

  xl:run:
    desc: Run the Plus XL deck in the foreground (Ctrl-C to stop)
    deps: [xl:install, xl:font, xl:patch, xl:icons]
    dir: decks/plus-xl
    dotenv: ['.env']
    preconditions:
      - sh: test -f .env
        msg: "No decks/plus-xl/.env — run `task xl:env` and fill it in first."
    cmds:
      # `python -m ext.run` rather than the console script: ext/ installs the
      # local-action wrappers before handing off to the app's own main(). ext/
      # lives at the streamdeck/ root, two levels up from this dir.
      - PYTHONPATH=../.. ./.venv/bin/python -m ext.run --config configuration.yaml

  xl:regen:
    desc: Rebuild the Plus XL images and restart the service if it's running
    cmds:
      - {task: icons, vars: {DECK: plus-xl}}
      - |
        if launchctl print gui/$(id -u)/{{.XLLABEL}} >/dev/null 2>&1; then
          launchctl kickstart -k gui/$(id -u)/{{.XLLABEL}}
          echo ">> Images rebuilt and service restarted."
        else
          echo ">> Images rebuilt — restart 'task xl:run' to apply (image files are not auto-reloaded)."
        fi

  # ── plus-xl: run automatically at login (launchd) ─────────────────────────
  xl:service:
    desc: Install + start the Plus XL LaunchAgent (runs at login, restarts on crash)
    deps: [xl:install, xl:font, xl:patch, xl:icons]
    preconditions:
      - sh: test -f decks/plus-xl/.env
        msg: "No decks/plus-xl/.env — run `task xl:env` and fill it in first."
    cmds:
      - mkdir -p ~/Library/LaunchAgents ~/Library/Logs
      - cp decks/plus-xl/{{.XLLABEL}}.plist ~/Library/LaunchAgents/{{.XLLABEL}}.plist
      # bootout first so re-running picks up plist changes (ignore "not loaded")
      - launchctl bootout gui/$(id -u)/{{.XLLABEL}} 2>/dev/null || true
      - launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/{{.XLLABEL}}.plist
      - sleep 2
      - task: xl:service:status

  xl:service:status:
    desc: Show whether the Plus XL service is running
    cmds:
      - |
        if launchctl print gui/$(id -u)/{{.XLLABEL}} 2>/dev/null | grep -E "state = |pid = |last exit" ; then
          :
        else
          echo "not loaded — run 'task xl:service'"
        fi

  xl:service:logs:
    desc: Follow the Plus XL service log
    cmds: [tail -f ~/Library/Logs/streamdeck-xl.log]

  xl:service:restart:
    desc: Restart the Plus XL service
    cmds:
      - 'launchctl kickstart -k gui/$(id -u)/{{.XLLABEL}}'

  xl:service:stop:
    desc: Stop and uninstall the Plus XL LaunchAgent (won't start at login)
    cmds:
      - launchctl bootout gui/$(id -u)/{{.XLLABEL}} 2>/dev/null || true
      - rm -f ~/Library/LaunchAgents/{{.XLLABEL}}.plist
      - echo ">> Service stopped and removed."
