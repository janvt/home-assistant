substitutions:
  name: m5stack-wifi-meter
  friendly_name: M5Stack WiFi Meter

################################################################################################################
# Handheld Wi-Fi signal meter for the M5GO / Core Basic v2.7 (the controller in
# the M5Stack Starter Kit V2.7 M5GO IoT). Shows live RSSI in dBm, the network and
# access point it's reading, and the min/max seen since the last reset — carry it
# around the house to find dead spots.
#
# Standalone: flashing this replaces m5-core.yaml on the device.
#
# Buttons:  A (left) = switch network (home <-> Shrek)   B (centre) = reset min/max
# Screen brightness is the "Backlight" light in Home Assistant.
################################################################################################################
esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# M5Stack Core Basic v2.7: ESP32, 16 MB flash, no PSRAM
esp32:
  board: m5stack-grey
  flash_size: 16MB
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep the radio fully awake so readings track movement.
  power_save_mode: none
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "M5Stack WiFi Meter Fallback"
    password: !secret m5stack_core_basic__ap_password

api:
  encryption:
    key: !secret m5stack_core_basic__encryption

ota:
  - platform: esphome

logger:

captive_portal:

globals:
  - id: rssi_min
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: rssi_max
    type: float
    restore_value: no
    initial_value: 'NAN'
  # Which network button A last switched to. Restored, because the switch
  # itself is persisted (see switch_network).
  - id: on_shrek
    type: bool
    restore_value: yes
    initial_value: 'false'

script:
  - id: reset_min_max
    then:
      - lambda: |-
          id(rssi_min) = NAN;
          id(rssi_max) = NAN;
      - component.update: main_display
  # Toggle between the home network and Shrek. save: true is required, not a
  # preference: wifi.configure restarts the Wi-Fi component, and on start it
  # loads the saved network from flash over anything set in RAM — and its own
  # timeout revert writes that saved network. With save: false, every switch
  # after the first failed one silently reconnected to the old network.
  # The saved choice survives reboots until the next switch or reflash (the
  # flash slot is keyed to the firmware build).
  # Timeout 60s: one attempt is a scan plus up to two 10s handshakes, then an
  # adapter restart and two more, so 20s cut the target off mid-attempt. If it
  # still doesn't connect, ESPHome reverts to the previous network. on_shrek
  # flips only once connected, so pressing again mid-switch hits the same
  # (already busy) action and is ignored.
  - id: switch_network
    then:
      - if:
          condition:
            lambda: 'return !id(on_shrek);'
          then:
            - wifi.configure:
                ssid: !secret wifi_shrek_ssid
                password: !secret wifi_shrek_password
                save: true
                timeout: 60s
                on_connect:
                  - lambda: 'id(on_shrek) = true;'
                  - script.execute: reset_min_max
          else:
            - wifi.configure:
                ssid: !secret wifi_ssid
                password: !secret wifi_password
                save: true
                timeout: 60s
                on_connect:
                  - lambda: 'id(on_shrek) = false;'
                  - script.execute: reset_min_max

binary_sensor:
  # Physical buttons (active-low, external pull-ups on Core Basic v2.7)
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
      mode: INPUT
    name: "Btn A"
    id: btn_a
    internal: true
    on_press:
      - script.execute: switch_network
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
      mode: INPUT
    name: "Btn B"
    id: btn_b
    internal: true
    on_press:
      - script.execute: reset_min_max

sensor:
  # Drives the screen. 250ms so it reacts while walking around (the driver only
  # refreshes RSSI from beacons, ~10/s, so faster buys nothing); averaged over
  # the last 4 readings (~1s) to steady the number and min/max. Internal so
  # that rate doesn't flood the HA recorder.
  # A template rather than `wifi_signal`: that one asks the driver for the AP
  # record on every poll, which blocks the main loop for 100-500ms while the
  # radio is mid-connect (and then the buttons and display stall too). Only
  # ask once connected.
  - platform: template
    id: wifi_rssi
    name: "WiFi Signal (live)"
    unit_of_measurement: dBm
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 250ms
    internal: true
    lambda: |-
      if (!wifi::global_wifi_component->is_connected()) return {};
      int8_t rssi = wifi::global_wifi_component->wifi_rssi();
      if (rssi == wifi::WIFI_RSSI_DISCONNECTED) return {};
      return rssi;
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
    on_value:
      - lambda: |-
          if (isnan(id(rssi_min)) || x < id(rssi_min)) id(rssi_min) = x;
          if (isnan(id(rssi_max)) || x > id(rssi_max)) id(rssi_max) = x;
  # The same reading for Home Assistant, once a minute.
  - platform: copy
    source_id: wifi_rssi
    name: "WiFi Signal"
    filters:
      - throttle: 60s

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_info
      internal: true
    bssid:
      id: wifi_bssid_info
      name: "Access Point"

# Backlight: direct LEDC PWM on GPIO32 (Core Basic v2.7 wiring)
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    id: backlight
    default_transition_length: 0s
    # Brightness is set from Home Assistant and remembered across reboots.
    restore_mode: RESTORE_DEFAULT_ON

color:
  - id: color_bg
    hex: '1a1a2e'
  - id: color_white
    hex: 'ffffff'
  - id: color_dim
    hex: '666666'
  - id: color_track
    hex: '333355'
  - id: color_good
    hex: '69f0ae'
  - id: color_fair
    hex: 'ffb74d'
  - id: color_weak
    hex: 'ef5350'

font:
  - file: "gfonts://Space Grotesk"
    id: big_font
    size: 72
    glyphs: "-0123456789"
  - file: "gfonts://Space Grotesk"
    id: mid_font
    size: 18
    glyphs: " !#%'()+,-./:0123456789?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Space Grotesk"
    id: small_font
    size: 14
    glyphs: " !#%'()+,-./:0123456789?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz"

# SPI: MOSI=GPIO23, CLK=GPIO18
spi:
  id: spi_bus
  mosi_pin: GPIO23
  clk_pin: GPIO18

# Display: ILI9342C 320x240. The M5CORE model carries the Core Basic's pins
# (CS=GPIO14, DC=GPIO27, RESET=GPIO33) and init sequence, and needs no PSRAM.
# buffer_size 15% (~23 KB) — required without PSRAM; a full buffer won't fit.
display:
  - platform: mipi_spi
    model: M5CORE
    id: main_display
    invert_colors: true
    buffer_size: 15%
    # Each redraw is several partial-buffer passes, so 500ms rather than
    # matching the 250ms sensor keeps the buttons responsive.
    update_interval: 500ms
    lambda: |-
      it.fill(id(color_bg));

      // Network and access point (BSSID tells mesh nodes apart)
      std::string ssid = id(wifi_ssid_info).has_state() ? id(wifi_ssid_info).state : "";
      it.printf(160, 20, id(mid_font), id(color_white), TextAlign::CENTER, "%s",
                ssid.empty() ? "Not connected" : ssid.c_str());
      if (id(wifi_bssid_info).has_state() && !ssid.empty()) {
        it.printf(160, 42, id(small_font), id(color_dim), TextAlign::CENTER, "%s",
                  id(wifi_bssid_info).state.c_str());
      }

      // Bar track: -90 dBm (empty) .. -30 dBm (full), ticks at -67 and -75
      const int bx = 20, by = 150, bw = 280, bh = 14;
      auto to_x = [&](float dbm) {
        float n = std::min(1.0f, std::max(0.0f, (dbm + 90.0f) / 60.0f));
        return bx + (int) (n * bw);
      };
      it.filled_rectangle(bx, by, bw, bh, id(color_track));

      bool live = id(wifi_rssi).has_state() && !std::isnan(id(wifi_rssi).state) && !ssid.empty();
      if (live) {
        float dbm = id(wifi_rssi).state;
        // -67 dBm is the usual floor for smooth streaming / video calls
        const char *quality = dbm >= -55 ? "Excellent" : dbm >= -67 ? "Good" : dbm >= -75 ? "Fair" : "Weak";
        Color c = dbm >= -67 ? id(color_good) : dbm >= -75 ? id(color_fair) : id(color_weak);

        it.printf(160, 98, id(big_font), c, TextAlign::CENTER, "%.0f", dbm);
        it.print(160, 136, id(small_font), id(color_dim), TextAlign::CENTER, "dBm");
        it.filled_rectangle(bx, by, to_x(dbm) - bx, bh, c);
        it.printf(160, 184, id(mid_font), c, TextAlign::CENTER, "%s", quality);
      } else {
        it.print(160, 98, id(big_font), id(color_dim), TextAlign::CENTER, "--");
        it.print(160, 136, id(small_font), id(color_dim), TextAlign::CENTER, "dBm");
      }
      it.vertical_line(to_x(-67), by - 3, bh + 6, id(color_white));
      it.vertical_line(to_x(-75), by - 3, bh + 6, id(color_white));

      // Range seen since the last reset
      if (!isnan(id(rssi_min))) {
        it.printf(160, 208, id(small_font), id(color_dim), TextAlign::CENTER,
                  "min %.0f   max %.0f", id(rssi_min), id(rssi_max));
      }

      // Button hints, above the physical buttons
      it.print(65, 231, id(small_font), id(color_dim), TextAlign::CENTER, "network");
      it.print(160, 231, id(small_font), id(color_dim), TextAlign::CENTER, "reset");
