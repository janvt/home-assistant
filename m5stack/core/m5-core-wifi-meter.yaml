substitutions:
  name: m5stack-wifi-meter
  friendly_name: M5Stack WiFi Meter

################################################################################################################
# Handheld Wi-Fi signal meter for the M5GO / Core Basic v2.7 (the controller in
# the M5Stack Starter Kit V2.7 M5GO IoT). Shows live RSSI in dBm, a graph of the
# last 70 seconds, the network and access point it's reading, and the min/max
# seen since the last reset — carry it around the house to find dead spots.
#
# Standalone: flashing this replaces m5-core.yaml on the device.
#
# Buttons:  A (left) = switch network (home <-> Shrek)   B (centre) = reset graph and min/max
# Screen brightness is the "Backlight" light in Home Assistant; the M5GO base's
# LED bars glow the signal colour and are the "Signal LEDs" light.
################################################################################################################
esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# M5Stack Core Basic v2.7: ESP32, 16 MB flash, no PSRAM
esp32:
  board: m5stack-grey
  flash_size: 16MB
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep the radio fully awake so readings track movement.
  power_save_mode: none
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "M5Stack WiFi Meter Fallback"
    password: !secret m5stack_core_basic__ap_password

api:
  encryption:
    key: !secret m5stack_core_basic__encryption

ota:
  - platform: esphome

logger:

captive_portal:

globals:
  - id: rssi_min
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: rssi_max
    type: float
    restore_value: no
    initial_value: 'NAN'
  # Graph samples, oldest first: one per 250ms, capped at the graph's 280px
  # width (= 70s). NAN marks time spent disconnected, drawn as a gap.
  - id: rssi_history
    type: std::vector<float>
    restore_value: no
  # Which network button A last switched to. Restored, because the switch
  # itself is persisted (see switch_network).
  - id: on_shrek
    type: bool
    restore_value: yes
    initial_value: 'false'

script:
  - id: reset_min_max
    then:
      - lambda: |-
          id(rssi_min) = NAN;
          id(rssi_max) = NAN;
          id(rssi_history).clear();
      - component.update: main_display
  # Toggle between the home network and Shrek. save: true is required, not a
  # preference: wifi.configure restarts the Wi-Fi component, and on start it
  # loads the saved network from flash over anything set in RAM — and its own
  # timeout revert writes that saved network. With save: false, every switch
  # after the first failed one silently reconnected to the old network.
  # The saved choice survives reboots until the next switch or reflash (the
  # flash slot is keyed to the firmware build).
  # Timeout 60s: one attempt is a scan plus up to two 10s handshakes, then an
  # adapter restart and two more, so 20s cut the target off mid-attempt. If it
  # still doesn't connect, ESPHome reverts to the previous network. on_shrek
  # flips only once connected, so pressing again mid-switch hits the same
  # (already busy) action and is ignored.
  - id: switch_network
    then:
      - if:
          condition:
            lambda: 'return !id(on_shrek);'
          then:
            - wifi.configure:
                ssid: !secret wifi_shrek_ssid
                password: !secret wifi_shrek_password
                save: true
                timeout: 60s
                on_connect:
                  - lambda: 'id(on_shrek) = true;'
                  - script.execute: reset_min_max
          else:
            - wifi.configure:
                ssid: !secret wifi_ssid
                password: !secret wifi_password
                save: true
                timeout: 60s
                on_connect:
                  - lambda: 'id(on_shrek) = false;'
                  - script.execute: reset_min_max

binary_sensor:
  # Physical buttons (active-low, external pull-ups on Core Basic v2.7)
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
      mode: INPUT
    name: "Btn A"
    id: btn_a
    internal: true
    on_press:
      - script.execute: switch_network
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
      mode: INPUT
    name: "Btn B"
    id: btn_b
    internal: true
    on_press:
      - script.execute: reset_min_max

sensor:
  # Drives the screen. 250ms so it reacts while walking around (the driver only
  # refreshes RSSI from beacons, ~10/s, so faster buys nothing); averaged over
  # the last 4 readings (~1s) to steady the number and min/max. Internal so
  # that rate doesn't flood the HA recorder.
  # A template rather than `wifi_signal`: that one asks the driver for the AP
  # record on every poll, which blocks the main loop for 100-500ms while the
  # radio is mid-connect (and then the buttons and display stall too). Only
  # ask once connected.
  - platform: template
    id: wifi_rssi
    name: "WiFi Signal (live)"
    unit_of_measurement: dBm
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 250ms
    internal: true
    lambda: |-
      if (!wifi::global_wifi_component->is_connected()) return {};
      int8_t rssi = wifi::global_wifi_component->wifi_rssi();
      if (rssi == wifi::WIFI_RSSI_DISCONNECTED) return {};
      return rssi;
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
    on_value:
      - lambda: |-
          if (isnan(id(rssi_min)) || x < id(rssi_min)) id(rssi_min) = x;
          if (isnan(id(rssi_max)) || x > id(rssi_max)) id(rssi_max) = x;
  # The same reading for Home Assistant, once a minute.
  - platform: copy
    source_id: wifi_rssi
    name: "WiFi Signal"
    filters:
      - throttle: 60s

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_info
      internal: true
    bssid:
      id: wifi_bssid_info
      name: "Access Point"

# Feed the graph on a fixed clock rather than from the sensor's on_value: the
# sensor goes quiet while disconnected, which would freeze the time axis
# instead of leaving a gap.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          auto &h = id(rssi_history);
          bool live = wifi::global_wifi_component->is_connected() && id(wifi_rssi).has_state();
          h.push_back(live ? id(wifi_rssi).state : NAN);
          if (h.size() > 280) h.erase(h.begin());

# Backlight: direct LEDC PWM on GPIO32 (Core Basic v2.7 wiring)
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    id: backlight
    default_transition_length: 0s
    # Brightness is set from Home Assistant and remembered across reboots.
    restore_mode: RESTORE_DEFAULT_ON

  # M5GO base: 10 SK6812s (5 per side bar) on GPIO15. They mirror the screen's
  # signal colour so it reads from across a room, and go dark while
  # disconnected. Brightness/off from Home Assistant; starts at 30% because
  # the bars are bright and draw real current on battery.
  - platform: esp32_rmt_led_strip
    name: "Signal LEDs"
    id: signal_leds
    pin:
      number: GPIO15
      ignore_strapping_warning: true  # output-only; the base is wired here
    num_leds: 10
    chipset: SK6812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      state: true
      brightness: 30%
    effects:
      - addressable_lambda:
          name: "Signal"
          update_interval: 250ms
          lambda: |-
            float dbm = id(wifi_rssi).has_state() ? id(wifi_rssi).state : NAN;
            if (!wifi::global_wifi_component->is_connected() || std::isnan(dbm)) {
              it.all() = Color::BLACK;
              return;
            }
            it.all() = dbm >= -67 ? id(color_good) : dbm >= -75 ? id(color_fair) : id(color_weak);
    # Turning a light off drops its effect, so turning it back on (from HA or
    # on boot) would otherwise come up plain white instead of the signal.
    on_turn_on:
      - light.turn_on:
          id: signal_leds
          effect: "Signal"

color:
  - id: color_bg
    hex: '1a1a2e'
  - id: color_white
    hex: 'ffffff'
  - id: color_dim
    hex: '666666'
  - id: color_track
    hex: '333355'
  - id: color_good
    hex: '69f0ae'
  - id: color_fair
    hex: 'ffb74d'
  - id: color_weak
    hex: 'ef5350'

font:
  - file: "gfonts://Space Grotesk"
    id: big_font
    size: 56
    glyphs: "-0123456789"
  - file: "gfonts://Space Grotesk"
    id: mid_font
    size: 18
    glyphs: " !#%'()+,-./:0123456789?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Space Grotesk"
    id: small_font
    size: 14
    glyphs: " !#%'()+,-./:0123456789?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz"

# SPI: MOSI=GPIO23, CLK=GPIO18
spi:
  id: spi_bus
  mosi_pin: GPIO23
  clk_pin: GPIO18

# Display: ILI9342C 320x240. The M5CORE model carries the Core Basic's pins
# (CS=GPIO14, DC=GPIO27, RESET=GPIO33) and init sequence, and needs no PSRAM.
# buffer_size 15% (~23 KB) — required without PSRAM; a full buffer won't fit.
display:
  - platform: mipi_spi
    model: M5CORE
    id: main_display
    invert_colors: true
    buffer_size: 15%
    # Each redraw is several partial-buffer passes, so 500ms rather than
    # matching the 250ms sensor keeps the buttons responsive.
    update_interval: 500ms
    lambda: |-
      it.fill(id(color_bg));

      // Network and access point (BSSID tells mesh nodes apart)
      std::string ssid = id(wifi_ssid_info).has_state() ? id(wifi_ssid_info).state : "";
      it.printf(160, 20, id(mid_font), id(color_white), TextAlign::CENTER, "%s",
                ssid.empty() ? "Not connected" : ssid.c_str());
      if (id(wifi_bssid_info).has_state() && !ssid.empty()) {
        it.printf(160, 42, id(small_font), id(color_dim), TextAlign::CENTER, "%s",
                  id(wifi_bssid_info).state.c_str());
      }

      // -67 dBm is the usual floor for smooth streaming / video calls
      auto color_for = [&](float dbm) {
        return dbm >= -67 ? id(color_good) : dbm >= -75 ? id(color_fair) : id(color_weak);
      };

      // Current reading: number, with unit and quality stacked to its right
      bool live = id(wifi_rssi).has_state() && !std::isnan(id(wifi_rssi).state) && !ssid.empty();
      if (live) {
        float dbm = id(wifi_rssi).state;
        const char *quality = dbm >= -55 ? "Excellent" : dbm >= -67 ? "Good" : dbm >= -75 ? "Fair" : "Weak";
        it.printf(178, 80, id(big_font), color_for(dbm), TextAlign::CENTER_RIGHT, "%.0f", dbm);
        it.print(186, 70, id(small_font), id(color_dim), TextAlign::CENTER_LEFT, "dBm");
        it.printf(186, 90, id(mid_font), color_for(dbm), TextAlign::CENTER_LEFT, "%s", quality);
      } else {
        it.print(178, 80, id(big_font), id(color_dim), TextAlign::CENTER_RIGHT, "--");
        it.print(186, 70, id(small_font), id(color_dim), TextAlign::CENTER_LEFT, "dBm");
      }

      // Graph: -90 dBm (bottom) .. -30 dBm (top), newest sample at the right
      // edge, 1px per sample. Dotted lines mark -67 and -75.
      const int gx = 20, gy = 114, gw = 280, gh = 82;
      auto to_y = [&](float dbm) {
        float n = std::min(1.0f, std::max(0.0f, (dbm + 90.0f) / 60.0f));
        return gy + gh - 1 - (int) (n * (gh - 1));
      };
      it.rectangle(gx - 1, gy - 1, gw + 2, gh + 2, id(color_track));
      for (int x = gx; x < gx + gw; x += 4) {
        it.draw_pixel_at(x, to_y(-67), id(color_dim));
        it.draw_pixel_at(x, to_y(-75), id(color_dim));
      }
      const auto &h = id(rssi_history);
      const int x0 = gx + gw - (int) h.size();
      for (size_t i = 1; i < h.size(); i++) {
        if (std::isnan(h[i - 1]) || std::isnan(h[i])) continue;
        it.line(x0 + i - 1, to_y(h[i - 1]), x0 + i, to_y(h[i]), color_for(h[i]));
      }

      // Range seen since the last reset
      if (!isnan(id(rssi_min))) {
        it.printf(160, 211, id(small_font), id(color_dim), TextAlign::CENTER,
                  "min %.0f   max %.0f", id(rssi_min), id(rssi_max));
      }

      // Button hints, above the physical buttons
      it.print(65, 231, id(small_font), id(color_dim), TextAlign::CENTER, "network");
      it.print(160, 231, id(small_font), id(color_dim), TextAlign::CENTER, "reset");
