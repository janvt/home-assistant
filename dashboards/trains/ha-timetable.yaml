# ─────────────────────────────────────────────────────────────────────────────
# Trains past the window: the timetable, and the trains the cameras missed
#
# GENERATED by dashboards/trains/timetable.py (`python timetable.py`), which
# holds the matching once for this file and for the automation sync.py pushes.
# Change it there, not here: a test fails when the two differ.
#
# WHAT
#   rest: three station boards from transport.opendata.ch (free, no key),
#     refreshed every 5 minutes:
#     - Altdorf UR arrivals: trains that stop at Altdorf.
#     - Arth-Goldau departures: southbound trains; those whose stops skip
#       Altdorf fly through it, TRAVEL_SOUTH min after leaving Arth-Goldau.
#     - Bellinzona departures: northbound trains; those that skip Altdorf fly
#       through it TRAVEL_NORTH min after leaving Bellinzona.
#     Each board starts a little in the past, so a train that has just passed
#     is still on it. Only the fields the matching needs are fetched, to keep
#     each sensor's attributes small.
#   template: sensor.timetable_trains_past, the timetable trains that went
#     past, with whether each camera saw them. Its state is how many no camera
#     saw today.
#
# INSTALL
#   As a package: copy this file to /config/packages/trains_timetable.yaml,
#   have configuration.yaml load the folder,
#       homeassistant:
#         packages: !include_dir_named packages
#   and restart Home Assistant (packages load only on a restart). After a
#   change, replace the file and restart again. Everything else (helpers, the
#   matching automation, the dashboard) is pushed by
#   dashboards/trains/sync.py over the API.
#
# RATE
#   3 boards every 300 s is ~860 requests a day. transport.opendata.ch is a
#   free community service: don't poll faster.
# ─────────────────────────────────────────────────────────────────────────────

rest:
- resource_template: https://transport.opendata.ch/v1/stationboard?station=8505113&type=arrival&limit=20&datetime={{ (now() - timedelta(minutes=15)).strftime('%Y-%m-%d') }}%20{{ (now() - timedelta(minutes=15)).strftime('%H:%M') }}&fields[]=stationboard/category&fields[]=stationboard/number&fields[]=stationboard/to&fields[]=stationboard/stop/departure&fields[]=stationboard/stop/delay&fields[]=stationboard/stop/arrival&fields[]=stationboard/stop/platform
  scan_interval: 300
  timeout: 20
  sensor:
  - name: Altdorf arrivals
    unique_id: trains_board_altdorf_arrivals
    icon: mdi:train
    value_template: '{{ value_json.stationboard | count }}'
    json_attributes:
    - stationboard
- resource_template: https://transport.opendata.ch/v1/stationboard?station=Arth-Goldau&limit=40&datetime={{ (now() - timedelta(minutes=40)).strftime('%Y-%m-%d') }}%20{{ (now() - timedelta(minutes=40)).strftime('%H:%M') }}&fields[]=stationboard/category&fields[]=stationboard/number&fields[]=stationboard/to&fields[]=stationboard/stop/departure&fields[]=stationboard/stop/delay&fields[]=stationboard/passList/station/name
  scan_interval: 300
  timeout: 20
  sensor:
  - name: Arth-Goldau departures
    unique_id: trains_board_arth_goldau_departures
    icon: mdi:train
    value_template: '{{ value_json.stationboard | count }}'
    json_attributes:
    - stationboard
- resource_template: https://transport.opendata.ch/v1/stationboard?station=Bellinzona&limit=40&datetime={{ (now() - timedelta(minutes=60)).strftime('%Y-%m-%d') }}%20{{ (now() - timedelta(minutes=60)).strftime('%H:%M') }}&fields[]=stationboard/category&fields[]=stationboard/number&fields[]=stationboard/to&fields[]=stationboard/stop/departure&fields[]=stationboard/stop/delay&fields[]=stationboard/passList/station/name
  scan_interval: 300
  timeout: 20
  sensor:
  - name: Bellinzona departures
    unique_id: trains_board_bellinzona_departures
    icon: mdi:train
    value_template: '{{ value_json.stationboard | count }}'
    json_attributes:
    - stationboard
template:
- triggers:
  - trigger: state
    entity_id: binary_sensor.train_passing
    from: 'off'
    to: 'on'
    id: Reolink
  - trigger: state
    entity_id: binary_sensor.train_passing_tele
    from: 'off'
    to: 'on'
    id: iPhone
  - trigger: time_pattern
    minutes: /5
    id: check
  sensor:
  - name: Timetable trains past
    unique_id: trains_timetable_past
    icon: mdi:train-car
    state: '{% set ns = namespace(n=0) %}{% for p in (this.attributes.get(''past'', []) if this.attributes is defined else []) %}{% if p.t > today_at().timestamp() and not p.reolink and not p.iphone %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}{{ ns.n }}'
    attributes:
      since: '{{ (this.attributes.get(''since'', 0) if this.attributes is defined else 0) or now().timestamp() | int }}'
      seen_reolink: '{% set keep = (this.attributes.get(''seen_reolink'', []) if this.attributes is defined else []) | select(''gt'', now().timestamp() - 7200) | list %}{{ keep + [now().timestamp() | int] if trigger.id == ''Reolink'' else keep }}'
      seen_iphone: '{% set keep = (this.attributes.get(''seen_iphone'', []) if this.attributes is defined else []) | select(''gt'', now().timestamp() - 7200) | list %}{{ keep + [now().timestamp() | int] if trigger.id == ''iPhone'' else keep }}'
      past: '{% set old = (this.attributes.get(''past'', []) if this.attributes is defined else []) | selectattr(''t'', ''gt'', now().timestamp() - 86400) | list %}{% set since = ((this.attributes.get(''since'', 0) if this.attributes is defined else 0) | int(0)) or now().timestamp() %}{% if trigger.id != ''check'' %}{{ old }}{% else %}{% set t = now().timestamp() %}{% set ns = namespace(c=[]) %}{% macro name(j) %}{{ j.category }} {{ j.number | int(j.number) }} → {{ j.to }}{% endmacro %}{% for j in state_attr(''sensor.altdorf_arrivals'',''stationboard'') or [] %}{% set at = j.stop.arrival or j.stop.departure %}{% if at %}{% set ns.c = ns.c + [{''d'': as_timestamp(at) + (j.stop.delay or 0) * 60 - t, ''n'': name(j), ''k'': ''stops, platform '' ~ (j.stop.platform or ''?''), ''late'': j.stop.delay or 0, ''key'': name(j) ~ at}] %}{% endif %}{% endfor %}{% for j in state_attr(''sensor.arth_goldau_departures'',''stationboard'') or [] %}{% set s = (j.passList or []) | map(attribute=''station.name'') | list %}{% if ''Bellinzona'' in s and ''Altdorf UR'' not in s %}{% set ns.c = ns.c + [{''d'': as_timestamp(j.stop.departure) + ((j.stop.delay or 0) + states(''input_number.train_through_minutes_south'') | float(18)) * 60 - t, ''n'': name(j), ''k'': ''through, southbound'', ''late'': j.stop.delay or 0, ''key'': name(j) ~ j.stop.departure}] %}{% endif %}{% endfor %}{% for j in state_attr(''sensor.bellinzona_departures'',''stationboard'') or [] %}{% set s = (j.passList or []) | map(attribute=''station.name'') | list %}{% if ''Arth-Goldau'' in s and ''Altdorf UR'' not in s %}{% set ns.c = ns.c + [{''d'': as_timestamp(j.stop.departure) + ((j.stop.delay or 0) + states(''input_number.train_through_minutes_north'') | float(32)) * 60 - t, ''n'': name(j), ''k'': ''through, northbound'', ''late'': j.stop.delay or 0, ''key'': name(j) ~ j.stop.departure}] %}{% endif %}{% endfor %}{% set w = states(''input_number.train_match_window'') | float(3) * 60 %}{% set keys = old | map(attribute=''key'') | list %}{% set ns3 = namespace(new=[]) %}{% for c in ns.c | sort(attribute=''d'') if c.d < -w and c.d > -1800 and c.key not in keys %}{% set ct = (t + c.d) | int %}{% if ct > since %}{% set f_reolink = (this.attributes.get(''seen_reolink'', []) if this.attributes is defined else []) | select(''ge'', ct - w) | select(''le'', ct + w) | list | count > 0 %}{% set f_iphone = (this.attributes.get(''seen_iphone'', []) if this.attributes is defined else []) | select(''ge'', ct - w) | select(''le'', ct + w) | list | count > 0 %}{% set ns3.new = ns3.new + [{''t'': ct, ''n'': c.n, ''k'': c.k, ''key'': c.key, ''reolink'': f_reolink, ''iphone'': f_iphone}] %}{% endif %}{% endfor %}{{ (old + ns3.new)[-200:] }}{% endif %}'
