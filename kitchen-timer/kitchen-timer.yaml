substitutions:
  name: kitchen-timer
  friendly_name: Kitchen Timer
  # The Home Assistant timer this device controls and mirrors. It must exist in
  # HA (see README.md, "Home Assistant setup"), with restore enabled.
  timer_entity: timer.kitchen

################################################################################
# Architecture: Home Assistant owns the timer, this device is a thin client.
#
#   knob + button  ──timer.start/pause/cancel──▶  timer.kitchen (HA)
#   display        ◀──state, finishes_at, remaining──┘
#
# The countdown is computed locally from HA's absolute `finishes_at` and the
# HA-synced clock, because HA's `remaining` attribute does not tick while the
# timer runs. The deadline is cached, so a running timer keeps counting down and
# still rings if Wi-Fi or HA drop out mid-cooking. Without a connection only the
# knob and silencing an alarm work; starting/pausing/cancelling is refused, so
# HA stays the single source of truth.
#
# Needs "Allow the device to perform Home Assistant actions" enabled in the
# ESPHome integration's options for this device.
################################################################################

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - kitchen_timer_helpers.h

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:

api:
  encryption:
    key: !secret kitchentimerencryption

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------------------
# Local state. Modes are kitchen_timer::Mode (IDLE/ACTIVE/PAUSED/RINGING).
# ---------------------------------------------------------------------------
globals:
  - id: mode
    type: int
    initial_value: "0"
  # what the knob dials in; survives reboots
  - id: set_seconds
    type: int
    restore_value: true
    initial_value: "300"
  # Unix time the running timer ends (from finishes_at)
  - id: deadline
    type: int64_t
    initial_value: "0"
  # time left while paused (from remaining)
  - id: paused_s
    type: int
    initial_value: "0"
  # seconds on the display while running; -1 = clock not synced
  - id: shown_s
    type: int
    initial_value: "0"
  # millis(): end of the optimistic window after a button press
  - id: pending_until
    type: uint32_t
    initial_value: "0"
  # millis(): show "----" after a refused press (no connection)
  - id: refused_until
    type: uint32_t
    initial_value: "0"

# ---------------------------------------------------------------------------
# Home Assistant → device. Each update re-derives the local mode from HA.
# ---------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_state
    entity_id: ${timer_entity}
    internal: true
    on_value:
      - script.execute: apply_ha_state
  - platform: homeassistant
    id: ha_finishes_at
    entity_id: ${timer_entity}
    attribute: finishes_at
    internal: true
    on_value:
      - script.execute: apply_ha_state
  - platform: homeassistant
    id: ha_remaining
    entity_id: ${timer_entity}
    attribute: remaining
    internal: true
    on_value:
      - script.execute: apply_ha_state

script:
  # HA is authoritative for idle/active/paused. RINGING is local: by the time
  # the alarm sounds, HA has already gone idle, and the ring lasts until the
  # button is pressed.
  - id: apply_ha_state
    mode: queued
    then:
      - lambda: |-
          using namespace kitchen_timer;
          id(pending_until) = 0;  // HA answered; the optimistic window is over
          const std::string &state = id(ha_state).state;

          if (state == "active") {
            int64_t t;
            if (parse_iso8601(id(ha_finishes_at).state, t)) {
              id(deadline) = t;
              id(mode) = ACTIVE;
            }
            // else: state arrived before its finishes_at; the attribute's own
            // update will run this again.
          } else if (state == "paused") {
            int s;
            if (parse_hms(id(ha_remaining).state, s)) {
              id(paused_s) = s;
              id(mode) = PAUSED;
            }
          } else if (state == "idle") {
            if (id(mode) == ACTIVE) {
              // Idle after active: either it finished (ring) or it was cancelled
              // elsewhere (don't). Tolerance covers the second-granular clock.
              auto now = id(ha_time).now();
              if (now.is_valid() && now.timestamp >= id(deadline) - 2) {
                id(mode) = RINGING;
                id(beeper).execute();
              } else {
                id(mode) = IDLE;
              }
            } else if (id(mode) != RINGING) {
              id(mode) = IDLE;
            }
          }
          // "unavailable"/"unknown"/"": keep the cached state and keep counting.

  # Device → Home Assistant
  - id: ha_start
    then:
      - homeassistant.action:
          action: timer.start
          data:
            entity_id: ${timer_entity}
          data_template:
            duration: "{{ duration }}"
          variables:
            duration: |-
              return std::to_string(id(set_seconds));  // seconds; HA parses "300" as 5 min
  # timer.start without a duration resumes a paused timer
  - id: ha_resume
    then:
      - homeassistant.action:
          action: timer.start
          data:
            entity_id: ${timer_entity}
  - id: ha_pause
    then:
      - homeassistant.action:
          action: timer.pause
          data:
            entity_id: ${timer_entity}
  - id: ha_cancel
    then:
      - homeassistant.action:
          action: timer.cancel
          data:
            entity_id: ${timer_entity}

  - id: beeper
    mode: restart
    then:
      - while:
          condition:
            lambda: return id(mode) == kitchen_timer::RINGING;
          then:
            - output.turn_on: buzzer
            - delay: 150ms
            - output.turn_off: buzzer
            - delay: 350ms
  - id: refuse_beep
    mode: restart
    then:
      - repeat:
          count: 2
          then:
            - output.turn_on: buzzer
            - delay: 60ms
            - output.turn_off: buzzer
            - delay: 90ms

# ---------------------------------------------------------------------------
# Countdown tick and the optimistic-update safety net.
# ---------------------------------------------------------------------------
interval:
  - interval: 100ms
    then:
      - lambda: |-
          using namespace kitchen_timer;
          if (id(mode) == ACTIVE) {
            auto now = id(ha_time).now();
            if (!now.is_valid()) {
              id(shown_s) = -1;
            } else {
              const int64_t left = id(deadline) - now.timestamp;
              if (left <= 0) {
                // Ring from the cached deadline: works even if HA is gone.
                id(shown_s) = 0;
                id(mode) = RINGING;
                id(beeper).execute();
              } else {
                id(shown_s) = (int) left;
              }
            }
          }
          // A press updates the display optimistically. If HA hasn't confirmed
          // within the window (action rejected, connection lost), fall back to
          // whatever HA last said.
          if (id(pending_until) != 0 && (int32_t) (millis() - id(pending_until)) > 0) {
            id(apply_ha_state).execute();
          }

# ---------------------------------------------------------------------------
# Display: the custom multiplexer. Pin order is A B C D E F G DP / digits left to right.
# ---------------------------------------------------------------------------
mux7seg:
  id: display
  segment_pins: [GPIO4, GPIO5, GPIO6, GPIO7, GPIO8, GPIO9, GPIO10, GPIO11]
  digit_pins: [GPIO12, GPIO13, GPIO14, GPIO15]
  slot_time: 1ms        # 4 digits -> 250 Hz refresh per digit
  blank_time: 5us       # anti-ghosting gap; raise to ~20us if you see ghosts
  brightness: 80%
  update_interval: 50ms
  lambda: |-
    using namespace kitchen_timer;
    if ((int32_t) (id(refused_until) - millis()) > 0) {
      it.print("----");
      return;
    }
    int s;
    bool dot = true;
    switch (id(mode)) {
      case ACTIVE:
        s = id(shown_s);
        dot = (millis() % 1000) < 500;      // blinking separator: running
        break;
      case PAUSED:
        s = id(paused_s);                   // steady separator: paused
        break;
      case RINGING:
        if ((millis() / 400) % 2) return;   // buffer already cleared -> blank
        s = 0;
        break;
      default:
        s = id(set_seconds);
    }
    if (s < 0) {                            // running, but the clock isn't synced yet
      it.print("--.--");
      return;
    }
    if (s > 99 * 60 + 59) s = 99 * 60 + 59; // four digits: mm.ss up to 99:59
    if (dot)
      it.printf("%2d.%02d", s / 60, s % 60);
    else
      it.printf("%2d%02d", s / 60, s % 60);

# ---------------------------------------------------------------------------
# Input. The knob only sets the duration (locally, no round trip per detent).
# Steps: 10 s up to 2 min, 30 s up to 10 min, then 1 min.
# ---------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a:
      number: GPIO16
      mode: { input: true, pullup: true }
    pin_b:
      number: GPIO17
      mode: { input: true, pullup: true }
    resolution: 1     # tune to the EC11's detents: 1, 2 or 4 pulses per click
    on_clockwise:
      - lambda: |-
          if (id(mode) != kitchen_timer::IDLE) return;
          int s = id(set_seconds);
          int step = s < 120 ? 10 : (s < 600 ? 30 : 60);
          id(set_seconds) = std::min(s + step, 99 * 60 + 59);
    on_anticlockwise:
      - lambda: |-
          if (id(mode) != kitchen_timer::IDLE) return;
          int s = id(set_seconds);
          int step = s <= 120 ? 10 : (s <= 600 ? 30 : 60);
          id(set_seconds) = std::max(s - step, 0);

binary_sensor:
  - platform: gpio
    id: knob_button
    internal: true
    pin:
      number: GPIO18
      inverted: true
      mode: { input: true, pullup: true }
    on_click:
      # Short press: start / pause / resume / silence
      - min_length: 30ms
        max_length: 700ms
        then:
          - lambda: |-
              using namespace kitchen_timer;
              if (id(mode) == RINGING) {          // silencing is always local
                id(mode) = IDLE;
                return;
              }
              if (!api::global_api_server->is_connected()) {
                id(refused_until) = millis() + 1500;
                id(refuse_beep).execute();
                return;
              }
              auto now = id(ha_time).now();
              id(pending_until) = millis() + 3000;  // optimistic until HA confirms
              switch (id(mode)) {
                case IDLE:
                  if (id(set_seconds) == 0) { id(pending_until) = 0; return; }
                  if (now.is_valid()) {
                    id(deadline) = now.timestamp + id(set_seconds);
                    id(shown_s) = id(set_seconds);
                    id(mode) = ACTIVE;
                  }
                  id(ha_start).execute();
                  break;
                case ACTIVE:
                  id(paused_s) = std::max(id(shown_s), 0);
                  id(mode) = PAUSED;
                  id(ha_pause).execute();
                  break;
                case PAUSED:
                  if (now.is_valid()) {
                    id(deadline) = now.timestamp + id(paused_s);
                    id(shown_s) = id(paused_s);
                    id(mode) = ACTIVE;
                  }
                  id(ha_resume).execute();
                  break;
              }
      # Long press: cancel
      - min_length: 1s
        max_length: 10s
        then:
          - lambda: |-
              using namespace kitchen_timer;
              if (id(mode) == RINGING) { id(mode) = IDLE; return; }
              if (!api::global_api_server->is_connected()) {
                id(refused_until) = millis() + 1500;
                id(refuse_beep).execute();
                return;
              }
              id(pending_until) = millis() + 3000;
              id(mode) = IDLE;
              id(ha_cancel).execute();

# Brightness from Home Assistant: drives the PWM inside each digit's time slot.
number:
  - platform: template
    name: Display brightness
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 80
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(display).set_brightness(x / 100.0f);

# Buzzer: rings while RINGING, stops on button press.
output:
  - platform: gpio
    id: buzzer
    pin: GPIO21
