# ─────────────────────────────────────────────────────────────────────────────
# Active Scene Tracker
#
# PURPOSE
#   A single input_select helper acts as the source of truth for "which scene
#   is currently active". One automation, "Track active scene", sets it to
#   whichever scene was activated last. Both Stream Decks and the M5Stack Dial
#   read this helper and highlight the active scene button; the Stream Deck
#   scene toggle (script.streamdeck_scene_toggle) reads it too.
#
# TO ADD A NEW SCENE
#   1. Add its name (lowercase, the part after `scene.`) to the options below
#   2. Add the scene to the automation's trigger entity_id list
#   3. Add a corresponding button on the decks / dial
#
# HOW TO RESET TO NONE
#   Call  input_select.select_option  with option: none  from any automation,
#   script, or the HA UI to clear the active scene indicator.
# ─────────────────────────────────────────────────────────────────────────────

# Add to configuration.yaml (or your input_select.yaml if split):
input_select:
  active_scene:
    name: Active Scene
    options:
      - none    # Always keep "none" as the first option
      - vinyl
      - chill
      - cleaning
      - pain_cave
      - work
      - work_s
      - sleep
    initial: none
    icon: mdi:palette

# ─────────────────────────────────────────────────────────────────────────────

# Add the block below to your automations.yaml file.
# It replaces the seven "Mark … scene active" automations. Scenes going
# unavailable/unknown and coming back (restarts, scene reloads) are ignored:
# those used to fire all seven at once.
- id: '1793834156132'
  alias: "Track active scene"
  description: >-
    Sets input_select.active_scene to whichever scene was activated last.
    Ignores scenes going unavailable/unknown and coming back (restarts, scene
    reloads). The Stream Deck scene toggle reads the helper.
  triggers:
  - trigger: state
    entity_id:
    - scene.chill
    - scene.cleaning
    - scene.pain_cave
    - scene.sleep
    - scene.vinyl
    - scene.work
    - scene.work_s
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  conditions: []
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.active_scene
    data:
      # The option is the scene's own name: scene.work_s -> work_s. So every
      # scene in the trigger list needs a matching option above.
      option: "{{ trigger.entity_id.split('.')[1] }}"
  mode: queued
  max: 10
