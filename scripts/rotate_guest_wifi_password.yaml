# Paste into scripts.yaml (or the script editor's YAML mode). Needs packages/guest_wifi.yaml.
# Changing the passphrase disconnects every client on SchmatzGuest.
rotate_guest_wifi_password:
  alias: Rotate guest Wi-Fi password
  description: >-
    Generates a readable password, sets it on the SchmatzGuest WLAN via the UniFi OS API
    (session login with the homeass router user, credentials in secrets.yaml via
    rest_command.unifi_login), and only after the router confirms pushes it to the guest
    e-ink display. Changing the passphrase disconnects every client on SchmatzGuest.
  icon: mdi:form-textbox-password
  mode: single
  sequence:
    - variables:
        # Readable words + 2 digits. Longest possible result is 23 characters, which with
        # "SchmatzGuest" stays inside QR version 3 on the display (see tests/test_guest_wifi.py).
        new_password: >-
          {% set a = ['alp','apple','bell','cow','fern','gorge','ibex','lake','marmot','pine','ridge','river','scree','snow','stone','tell','trail','valley','wood','cloud'] %}{% set b = ['amber','brave','calm','clear','early','gentle','golden','green','happy','quiet','rapid','silver','sunny','swift','warm','wild'] %}{{ b | random }}-{{ a | random }}-{{ a | random }}-{{ range(10, 100) | random }}
        wlan_path: /proxy/network/api/s/default/rest/wlanconf/6ae39d2bd1b56675553f544a
    # UniFi OS session login; returns the TOKEN cookie and an X-Csrf-Token header.
    - action: rest_command.unifi_login
      response_variable: login
    - if:
        - condition: template
          value_template: "{{ login.status != 200 }}"
      then:
        - stop: UniFi login failed
          error: true
    - variables:
        token: >-
          {% set sc = login.headers.get('Set-Cookie', '') %}{% set sc = sc if sc is string else sc | join(';') %}{{ sc | regex_findall_index('TOKEN=([^;]+)') }}
        csrf: "{{ login.headers.get('X-Csrf-Token') or login.headers.get('x-updated-csrf-token') or '' }}"
    # Partial update: only x_passphrase changes.
    - action: rest_command.unifi_put
      data:
        path: "{{ wlan_path }}"
        token: "{{ token }}"
        csrf: "{{ csrf }}"
        body:
          x_passphrase: "{{ new_password }}"
      response_variable: result
    - if:
        - condition: template
          value_template: "{{ result.status != 200 or (result.content.meta.rc | default('')) != 'ok' }}"
      then:
        - stop: UniFi rejected the password change
          error: true
    # Only now, with the router confirmed, does the display get the new password.
    - action: text.set_value
      target:
        entity_id: text.guest_bedroom_guest_room_display_wi_fi_password
      data:
        value: "{{ new_password }}"
