# Holds the bathroom fan on after a shower until the humidity is back down.
#
# Needs one helper, which this file can't create: a Statistics sensor over the
# bathroom Ruuvi. Settings > Helpers > Statistics, or in configuration.yaml:
#
#   sensor:
#     - platform: statistics
#       name: Bathroom humidity change 10m
#       entity_id: sensor.bathroom_ruuvi_humidity
#       state_characteristic: change
#       max_age:
#         minutes: 10
#       # The Ruuvi reports every ~5 s, so 10 min is ~120 samples. The default
#       # of 20 would quietly shrink the window to under two minutes.
#       sampling_size: 300
#       precision: 2
#
# Why a rate and not a level: the bathroom baseline drifted between 44 and
# 64 %RH over a week (Oct 14-21 2026), and showers peaked at 57-64, so no fixed
# threshold separates them. A rise of 3 %RH within 10 minutes happened only
# during showers that week; the normal 99th percentile was +0.8.
#
# The hold is timer.bathroom_fan_hold, the same timer the wall button, the
# dashboards and the Stream Deck poop key start. Two other automations act on
# it: "Bathroom fan: hold and button run-on" switches the fan on whenever the
# timer starts, and "Bathroom lights" leaves the fan running while the timer
# is active and switches it off when the timer ends with nobody in the room.
# The timer is restored across restarts, so the fan can't get stuck on.
alias: Bathroom shower fan
description: >-
  Detects the humidity spike of a shower and holds the fan
  (timer.bathroom_fan_hold) until relative humidity is back within 1 %RH of
  where it was before, then 5 minutes of run-on. The timer survives restarts
  and caps the hold at 45 minutes, so the fan can't get stuck on.
id: bathroom_shower_fan
# A second spike while holding restarts with a fresh 45-minute cap rather than
# being ignored and released mid-shower by the old one.
mode: restart
triggers:
  - trigger: numeric_state
    entity_id: sensor.bathroom_humidity_change_10m
    above: 3
conditions: []
actions:
  - variables:
      # The change sensor just crossed 3, so current minus change is the
      # reading from ~10 minutes ago: the room before the shower started.
      target: >-
        {{ states('sensor.bathroom_ruuvi_humidity') | float(0)
           - states('sensor.bathroom_humidity_change_10m') | float(0) + 1 }}
  - action: light.turn_on
    target:
      entity_id: light.bathroom_mirror_fan_bathroom_mirror_fan
  # The cap: if the humidity never gets back down, the timer runs out after
  # 45 minutes and "Bathroom lights" switches the fan off.
  - action: timer.start
    target:
      entity_id: timer.bathroom_fan_hold
    data:
      duration: "00:45:00"
  # On timeout the run stops here and the 45-minute timer simply ends.
  - wait_template: >-
      {{ states('sensor.bathroom_ruuvi_humidity') | float(100) <= target }}
    timeout: "00:45:00"
    continue_on_timeout: false
  # Humidity is back down: shorten the hold to 5 minutes of run-on.
  - action: timer.start
    target:
      entity_id: timer.bathroom_fan_hold
    data:
      duration: "00:05:00"
