alias: "Guest name change: rotate guest Wi-Fi, switch network"
description: >-
  Any change of the guest name on the guest room display rotates the SchmatzGuest
  password. Name set: rotate, then enable the guest network. Name cleared (check-out):
  disable the guest network, then rotate so the old password is dead. Ignores reboots
  and unavailable blips of the display. Always switches the display back to the
  Welcome page first. See guest-eink/README.md.
id: "1793305230687"
# queued: clearing a name and typing the next one quickly runs both, in order.
mode: queued
max: 3
triggers:
  # The display reports an empty name as `unknown` after a reboot (and as "" when it is
  # cleared while running), so `unknown` must be allowed here: excluding it meant the
  # first check-in after a reboot rotated nothing and left the guest network off.
  # `unavailable` (reboots, Wi-Fi blips) never fires.
  - trigger: state
    entity_id: text.guest_bedroom_guest_room_display_guest_name
    not_from:
      - unavailable
    not_to:
      - unavailable
conditions:
  # unknown and "" both mean "no guest": a change between them is not a check-in or
  # check-out.
  - condition: template
    value_template: >-
      {% set f = '' if trigger.from_state.state == 'unknown' else trigger.from_state.state %}{% set t = '' if trigger.to_state.state == 'unknown' else trigger.to_state.state %}{{ f != t }}
actions:
  # Back to the welcome / Wi-Fi page first, so a message left up never hides the new
  # guest or the new QR code. The display coalesces this with the password update into
  # one refresh.
  - action: select.select_option
    target:
      entity_id: select.guest_room_display_page
    data:
      option: Welcome
  - if:
      - condition: state
        entity_id: text.guest_bedroom_guest_room_display_guest_name
        state:
          - ""
          - unknown
    then:
      # Check-out: take the guest network down first.
      - action: switch.turn_off
        target:
          entity_id: switch.schmatzguest_enabled
      - action: script.rotate_guest_wifi_password
    else:
      # New or changed guest: fresh password before the network comes up. If the rotation
      # fails the script stops with an error and the network stays off.
      - action: script.rotate_guest_wifi_password
      - action: switch.turn_on
        target:
          entity_id: switch.schmatzguest_enabled
