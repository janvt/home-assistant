[pytest]
# Tests live at the repo root because they cover all of it — the Stream Deck
# extension and renderer under streamdeck/, the ESPHome device configs under
# m5stack/, and the Home Assistant YAML at the top level.
#
# `streamdeck/ext/selftest.py` is NOT collected here: it is the deck's own
# unittest suite, run in the deck venv against the installed upstream app via
# `task xl:test` (and as its own CI step), because it needs `python -m
# ext.selftest` for its relative imports.
testpaths = tests
addopts = -ra --strict-markers
markers =
    esphome: needs the `esphome` package (config validation of the m5stack YAML)
