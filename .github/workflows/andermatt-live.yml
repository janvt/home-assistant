name: Andermatt Live checks

# Checks against the real A+S+D Live Dashboard that the lifts are still read
# correctly (see tests_live).  Twice a day, as the site can change at any time;
# and for changes to the code that reads it.
on:
  schedule:
    - cron: "23 7,15 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - andermatt-live/custom_components/andermatt_live/live.py
      - andermatt-live/tests_live/**
      - .github/workflows/andermatt-live.yml

concurrency:
  group: andermatt-live
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  live:
    name: Live site
    # The home runner (andermatt-live/scripts/setup-runner.sh): from home the
    # site serves its real pages, where GitHub's runners now and then get a
    # bot check.  Not for pull requests from forks, as the repository is
    # public: they would run their code at home.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository
      && 'ubuntu-24.04' || fromJSON('["self-hosted", "home"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: andermatt-live
    steps:
      - uses: actions/checkout@v7
      # uv's Pythons run on Debian too; setup-python's are built for Ubuntu.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: andermatt-live/requirements_test.txt
      - name: Install dependencies
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -r requirements_test.txt
      # The Home Assistant test plugins block the network.
      - name: Run the live tests
        env:
          ANDERMATT_LIVE_PAGES: ${{ runner.temp }}/pages
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:homeassistant -p no:socket tests_live -v
      # The pages the tests read, as the site served them: a failure can be
      # gone by the time anyone looks (a bot check's page, 27 November 2026).
      - name: Keep the pages
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-dashboard-pages
          path: ${{ runner.temp }}/pages
          retention-days: 30
          if-no-files-found: ignore
      # Scheduled runs report to an issue, assigned to the owner so that it
      # notifies them: opened (or commented on) when the checks fail, closed
      # when they pass again.
      - name: Report a failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label andermatt-live-checks --json number --jq '.[0].number')
          body="The checks against the Live Dashboard failed: $RUN"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create andermatt-live-checks --repo "$GITHUB_REPOSITORY" --force \
              --color d73a4a --description "The live checks are failing"
            gh issue create --repo "$GITHUB_REPOSITORY" --label andermatt-live-checks \
              --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "Live checks against the Live Dashboard are failing" --body "$body"
          fi
      - name: Close the failure report
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label andermatt-live-checks --json number --jq '.[].number'); do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "Passing again: $RUN"
          done
      # GitHub turns off scheduled workflows after 60 days without commits;
      # enabling it again resets that.
      - name: Keep the schedule on
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/andermatt-live.yml/enable"
