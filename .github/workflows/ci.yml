name: CI

# Nothing here touches hardware: no Stream Deck, no ESP32, no Home Assistant.
# The suite runs against stubbed decks and a stubbed macOS bridge, so it can
# validate both deck configs, the icon renderer and the ESPHome device configs
# on a plain Linux runner.
#
# Local equivalents:
#   task -d streamdeck test          the whole suite
#   task -d streamdeck test:esphome  the ESPHome validation job
#   task -d streamdeck xl:test       just the deck extension's own suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lets the icon tests fetch the Material Design Icons webfont on a cache miss
  # instead of skipping. See tests/conftest.py::mdi_codepoints.
  HASD_TEST_NETWORK: "1"

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is set by the upstream app (requires >= 3.10); the ceiling
        # is what the Mac deck actually runs on.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system libraries
        # libcairo2  — cairosvg, imported by the upstream app at module level
        # fonts-dejavu — the icon renderer needs a real TrueType face for labels
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 fonts-dejavu-core

      - name: Cache the Material Design Icons webfont
        uses: actions/cache@v4
        with:
          path: streamdeck/.iconbuild
          key: mdi-${{ hashFiles('streamdeck/generate_icons.py') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Show what is under test
        run: |
          python -c "import home_assistant_streamdeck_yaml as a; print('app', a.__version__)"
          python -c "import ext.wrap as w; print('tested against', w.TESTED_VERSION)" || true
        working-directory: streamdeck

      - name: Run the test suite
        run: pytest -q

      # The deck extension's own suite, run the documented way (`task xl:test`
      # does exactly this). The suite above wraps it, but running it directly
      # keeps its output readable when it is the thing that broke.
      - name: Run the deck extension selftest
        run: PYTHONPATH=. python -m ext.selftest
        working-directory: streamdeck

      # End-to-end render, which the unit tests deliberately do not do for
      # every deck: proves the real fonts, the real palette and the real specs
      # still produce a complete image set.
      - name: Render every deck's images
        run: |
          python generate_icons.py --deck all
          for deck in plus plus-xl; do
            keys=$(find "decks/$deck/icons" -maxdepth 1 -name '*.png' | wc -l)
            dials=$(find "decks/$deck/icons/dials" -name '*.png' | wc -l)
            echo "$deck: $keys keys, $dials dial frames"
            test "$keys" -gt 0 && test "$dials" -gt 0
          done
        working-directory: streamdeck

  esphome:
    name: esphome config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # setup-python's pip cache fails when it matches no dependency file,
          # and this repo's is not named requirements.txt.
          cache-dependency-path: requirements-test.txt

      # ESPHome's validator is the real schema check for the m5stack configs:
      # component schemas, pin conflicts, id types, lambda placement. It needs
      # the network — one config pulls an external component from GitHub, and
      # `mdi:` images are fetched per icon.
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome pytest pyyaml pillow

      - name: Cache ESPHome downloads
        uses: actions/cache@v4
        with:
          path: ~/.esphome
          key: esphome-${{ hashFiles('m5stack/*/*.yaml') }}
          restore-keys: esphome-

      # Stub secrets are generated by the test itself into a temp dir, so no
      # credentials are needed here. Known gaps are recorded as xfail in
      # tests/test_esphome_configs.py rather than skipped.
      - name: Validate every device config
        run: pytest -q -m esphome tests/test_esphome_configs.py

  macos:
    name: macos (deck host paths)
    # Manual only: the Mac-specific coverage is one test that shells out to
    # /usr/bin/open, and macOS runners are billed at 10x. Run it from the
    # Actions tab after touching ext/mac.py or the icon renderer's font paths.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # cairocffi dlopens libcairo at import time, and the upstream app imports
      # cairosvg at module level. Without this the app-dependent tests would
      # SKIP rather than fail, quietly making this job meaningless.
      - name: Install cairo
        run: brew install cairo

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Check the app really imports
        run: python -c "import home_assistant_streamdeck_yaml as a; print(a.__version__)"

      - name: Run the test suite
        run: pytest -q

      - name: Run the deck extension selftest
        run: PYTHONPATH=. python -m ext.selftest
        working-directory: streamdeck
